name: Bug report
description: Report reproducible incorrect behavior in JanusGate
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow the private reporting
        instructions in the repository security policy.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and its practical impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - OpenBSD
        - Alpine appliance
        - Buildroot appliance
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or source revision
      placeholder: 0.1.0 or full Git commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Remove credentials, client data, keys, and private addresses.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true

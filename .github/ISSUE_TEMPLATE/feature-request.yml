name: Feature request
description: Propose a focused improvement to JanusGate
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator or contributor need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest change that would address the need.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DNS and traffic policy
        - Management API or web interface
        - Installation and appliance images
        - Operations and observability
        - Documentation and development
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or simpler alternatives.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a related proposal.
          required: true
        - label: This request does not contain a security vulnerability.
          required: true
